[project]
name = "linear-rnn-parallelism-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2603.03612"
requires-python = "==3.12.*"
dependencies = [
  "marimo>=0.14",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "sympy>=1.13",
  "torch==2.8.0",
  "z3-solver>=4.13",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
